[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "imap"
version = "0.0.1"
description = "IMAP: Intelligent Message Analysis Platform — spam detection ML component built and deployed with MLOps practices."
authors = [
  { name = "Carles Aguilera" },
  { name = "Alex Bueno" },
  { name = "Joel Delgado" },
  { name = "Berta Torrents" },
  { name = "Diego Velilla" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "ruff>=0.16",
  "mypy>=2.0",
]

[tool.flit.module]
name = "src"  # Tells Flit: "The code for this project is inside the src/ folder"

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
extend-exclude = [
  ".venv",
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "./data",
  "./models",
  "./notebooks",
  "./reports",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "D213"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.10"
files = ["src"]
# Lenient to start with: untyped/missing libs do not fail.
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = false
