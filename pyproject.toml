[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mlops-datatouille"
version = "0.0.1"
description = "Spam detection ML system with spam detection, summarization, and automated feedback loops."
authors = [
  { name = "Carles Aguilera, Alex Bueno, Joel Delgado, Berta Torrents, Diego Velilla" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "ruff>=0.16",
]

[tool.flit.module]
name = "src"  # Tells Flit: "The code for this project is inside the src/ folder"

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
extend-exclude = [
  ".venv",
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "./data",
  "./models",
  "./notebooks",
  "./reports",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "D213"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
