data:
  raw: data/raw/daisy_dataset_spam_detection.csv
  clean: data/processed/clean.csv
  text_col: text
  label_col: label
  encoding: utf-8
  emojis_as_text: false

split:
  train: data/dataset/train.csv
  test: data/dataset/test.csv
  test_size: 0.2
  random_state: 42

train:
  models: [logreg, naive_bayes, linear_svm, random_forest]
  max_features: 3000
  cv_folds: 5
  random_state: 42
