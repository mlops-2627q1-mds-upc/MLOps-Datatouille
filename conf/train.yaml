defaults:
  - model: logreg
  - _self_
  - override hydra/job_logging: stdout

data:
  train: data/dataset/train.csv
  label_col: label

train:
  max_features: 3000
  cv_folds: 5
  random_state: 42
  n_trials: 10

model_out: models/model.joblib
metrics_out: reports/metrics/train/model.json

# Run in the repo root and write no outputs/<date>/ folders or log files: DVC tracks outputs.
hydra:
  run:
    dir: .
  output_subdir: null
