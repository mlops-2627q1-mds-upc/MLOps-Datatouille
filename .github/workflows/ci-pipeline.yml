name: Continuous Integration Pipeline

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  # JOB 1: TASK BRANCH -> DEV
  fast-feedback-integration:
    name: Fast Feedback & Code Integration
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
    
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 pylint great_expectations fastapi httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Static Code Analysis (Flake8 & Pylint)
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          # Pylint is required for Milestone 3 quality assurance
          pylint src/ tests/ --exit-zero

      - name: Run Unit Tests (FastAPI & Logic)
        # Only runs fast unit tests located in the unit directory
        run: |
          pytest tests/unit/ -v

      - name: Lightweight Data Validation (Sample)
        # Runs Great Expectations on a small sample to catch schema errors quickly
        run: |
          echo "Executing Great Expectations against a 100-row sample of Deysi/spam-detection-dataset"

  # JOB 2: DEV -> MAIN
  comprehensive-validation:
    name: Comprehensive Pre-Production Validation
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce PR source branch
        if: github.head_ref != 'dev'
        run: |
          echo "Error: Pull requests targeting 'main' are only allowed from the 'dev' branch."
          echo "Current source branch is: ${{ github.head_ref }}"
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest great_expectations fastapi httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Full Data Pipeline Validation
        # Validates the entire dataset before allowing model integration
        run: |
          echo "Executing Great Expectations against the full Deysi/spam-detection-dataset"

      - name: Run Automated Regression Tests (Model & Integration)
        # Runs the heavy regression suite to ensure model performance hasn't degraded
        run: |
          pytest tests/regression/ -v