name: Continuous Integration Pipeline

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  # JOB 1: TASK BRANCH -> DEV
  fast-feedback-integration:
    name: Fast Feedback & Code Integration
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
    
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest great_expectations fastapi httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Static Code Analysis (Ruff)
        run: |
          ruff check src tests
          ruff format --check src tests
      
      - name: Run Unit and Integration Tests
        run: |
          pytest tests/unit tests/integration -v -k "not test_processed_data" --cov=src --cov-fail-under=80

  # JOB 2: DEV -> MAIN
  comprehensive-validation:
    name: Comprehensive Pre-Production Validation
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce PR source branch
        if: github.head_ref != 'dev'
        run: |
          echo "Error: Pull requests targeting 'main' are only allowed from the 'dev' branch."
          echo "Current source branch is: ${{ github.head_ref }}"
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest great_expectations fastapi httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_USER }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_TOKEN }}
          
      - name: Pull data and models
        run: dvc pull
        
      - name: Full data validation (Great Expectations)
        run: python -m src.data.gx_context_configuration
        
      - name: Model regression and robustness tests
        run: |
          for model in logreg naive_bayes linear_svm random_forest; do
            MODEL_NAME="$model" pytest -q tests/regression/ || exit 1
          done
          
      - name: Unit and integration tests
        run: pytest tests/unit tests/integration -v
