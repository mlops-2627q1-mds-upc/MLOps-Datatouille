stages:
  preprocess:
    cmd: >-
      python -m src.data_preparation.phase_1_cleaning
      --input ${data.raw}
      --output ${data.clean}
      --text-col ${data.text_col}
      --label-col ${data.label_col}
      --encoding ${data.encoding}
    deps:
      - ${data.raw}
      - src/data_preparation/preprocess.py
      - src/data_preparation/phase_1_cleaning.py
    outs:
      - ${data.clean}

  split:
    cmd: >-
      python -m src.data_preparation.phase_2_splitting
      --input ${data.clean}
      --train ${split.train}
      --test ${split.test}
      --label-col ${data.label_col}
      --test-size ${split.test_size}
      --random-state ${split.random_state}
    deps:
      - ${data.clean}
      - src/data_preparation/preprocess.py
      - src/data_preparation/phase_2_splitting.py
    outs:
      - ${split.train}
      - ${split.test}

  train:
    foreach: ${train.models}
    do:
      cmd: >-
        python -m src.modeling.phase_3_training
        --model ${item}
        --train ${split.train}
        --model-out models/${item}.joblib
        --metrics-out metrics/${item}.json
        --label-col ${data.label_col}
        --max-features ${train.max_features}
        --cv-folds ${train.cv_folds}
        --random-state ${train.random_state}
      deps:
        - ${split.train}
        - src/modeling/phase_3_training.py
      outs:
        - models/${item}.joblib
      metrics:
        - metrics/${item}.json:
            cache: false